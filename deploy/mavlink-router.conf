[General]
TcpServerPort = 0
ReportStats = false

[UartEndpoint pixhawk]
Device = /dev/ttyACM0
Baud = 115200
FlowControl = false

# PixDoctorV2 listens on 14550. QGroundControl can use 14551 at the same time.
[UdpEndpoint pixdoctor]
Mode = Server
Address = 0.0.0.0
Port = 14550

[UdpEndpoint qgc]
Mode = Server
Address = 0.0.0.0
Port = 14551
